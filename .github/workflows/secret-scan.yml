name: Secret scan

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks before repository code
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          trap 'rm -rf "$tool_dir"' EXIT
          archive="$tool_dir/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          test "$("$tool_dir/gitleaks" version)" = "$GITLEAKS_VERSION"
          if ! "$tool_dir/gitleaks" dir \
            --no-banner \
            --no-color \
            --redact=100 \
            --max-archive-depth=3 \
            --config .gitleaks.toml \
            . >/dev/null 2>&1; then
            echo "::error::Gitleaks found a potential secret; details are suppressed."
            exit 1
          fi

      - name: Test the repository security policy
        run: python scripts/test_security_policy.py

      - name: Run the OSIA deterministic scanner
        run: python scripts/scan_secrets.py --osia-only
